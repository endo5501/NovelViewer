include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - memo/**
    - openspec/**
    - build/**
    - android/**
    - ios/**
    - windows/**
    - macos/**
    - linux/**
    - third_party/**
    # gen-l10n output. As of Flutter 3.50 its template still emits the
    # deprecated flutter_localizations delegates, and hand edits are lost on
    # regeneration. The app uses lib/l10n/app_localization_delegates.dart
    # instead. Exclude only generated files here, never hand-written code.
    - lib/l10n/app_localizations*.dart

linter:
  rules:
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_final_locals: true
    avoid_print: true
    prefer_single_quotes: true
    sort_child_properties_last: true
    use_build_context_synchronously: true
