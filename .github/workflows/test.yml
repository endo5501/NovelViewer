name: Test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Windows-only: several tests guard on Platform.isWindows and would
    # silently skip on ubuntu, turning a partial run green. This also
    # matches the release.yml build environment. Native DLLs (TTS/LAME/
    # Piper) are intentionally NOT built here: the FFI integration tests
    # self-skip when their .dll is absent (existsSync guard), so unit
    # tests need neither the Vulkan SDK nor the native build steps.
    runs-on: windows-latest

    steps:
      # Submodules are needed even though no native build runs here:
      # irodori_model_spec_asset_test compares the bundled model contract with
      # the engine's copy under third_party/audio.cpp, and a shipped contract
      # that has drifted from the engine silently narrows the request options
      # the engine will accept. audio.cpp is ~95 MiB and has no nested
      # submodules, so this costs far less than the Flutter SDK download the
      # next step already pays for.
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run analyzer
        run: flutter analyze

      - name: Run tests
        run: flutter test
